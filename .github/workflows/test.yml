name: Run Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fund_dashboard
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Wait for MySQL
      run: |
        until mysql -h 127.0.0.1 -u root -proot -e "SELECT 1"; do
          echo "Waiting for MySQL..."
          sleep 2
        done
    
    - name: Setup Database
      run: |
        mysql -h 127.0.0.1 -u root -proot fund_dashboard < database/deploy_database.sql
    
    - name: Create .env file
      run: |
        cat > .env << EOF
        SECRET_KEY=test-secret-key-for-github-actions-12345678901234567890
        DB_HOST=127.0.0.1
        DB_USER=root
        DB_PASSWORD=root
        DB_NAME=fund_dashboard
        ENVIRONMENT=testing
        DEBUG=True
        EOF
    
    - name: Run tests
      run: |
        pytest test_auth.py -v --cov=main --cov-report=xml --cov-report=term
    
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false